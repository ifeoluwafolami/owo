<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">OWO — Make Every Naira Count</title>
  <desc id="description">A blue OWO social preview graphic about spending, budgets, and savings.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Ferrite";
        src: url("../src/assets/fonts/FerriteCoreDX-Medium.ttf") format("truetype");
        font-weight: 500;
      }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17365f"/>
      <stop offset="1" stop-color="#31577f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#d8e8ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#d8e8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" rx="40" fill="url(#background)"/>
  <rect width="1200" height="630" rx="40" fill="url(#glow)"/>
  <circle cx="1060" cy="110" r="170" fill="#d8e8ff" opacity="0.08"/>
  <circle cx="1100" cy="560" r="260" fill="#d8e8ff" opacity="0.06"/>

  <g fill="#d8e8ff">
    <text x="92" y="208" font-family="Ferrite, Arial, Helvetica, sans-serif" font-size="112" font-weight="500" letter-spacing="12">OWO</text>
    <text x="96" y="295" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="600">Money talks. OWO listens.</text>
    <text x="96" y="354" font-family="Arial, Helvetica, sans-serif" font-size="27" opacity="0.82">Track spending. Plan budgets. Build savings.</text>
  </g>

  <g transform="translate(96 430)" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#17365f">
    <rect width="190" height="60" rx="30" fill="#d8e8ff"/>
    <text x="95" y="38" text-anchor="middle">SPENDING</text>
    <rect x="212" width="170" height="60" rx="30" fill="#d8e8ff"/>
    <text x="297" y="38" text-anchor="middle">BUDGETS</text>
    <rect x="404" width="170" height="60" rx="30" fill="#d8e8ff"/>
    <text x="489" y="38" text-anchor="middle">SAVINGS</text>
  </g>

  <text x="1100" y="560" text-anchor="end" fill="#d8e8ff" font-family="Arial, Helvetica, sans-serif" font-size="22" opacity="0.72">Every naira, accounted for.</text>
</svg>
